# ast-grep 중앙 설정 — 프로젝트 루트.
# 이 파일이 있으면 `sg scan`이 아래 ruleDirs의 모든 룰을 자동으로 적용한다
# (이전처럼 `sg scan --rule <경로>`로 룰을 하나씩 지정할 필요가 없다).
#
# 역할: CLAUDE.md SDD "함수 내부 로직 분석 레이어"의 위험 패턴 탐지를 표준화한다.
# ast-grep은 "위험 구조 노출" 도구이지 정답 판정 도구가 아니다 → 2단계 강제:
#   - severity: error  룰 매치 → CI/훅 실패 (깨면 안 되는 불변식)
#   - severity: warning/info/hint 룰 매치 → 보고만 (사람이 검토)
ruleDirs:
  - ast-grep/rules
