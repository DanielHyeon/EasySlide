<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시안 E 기존 구조 현대화</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F3F3F3}
button,input,select{font-family:inherit}
a{color:#005FB8}a:hover{color:#00437F}
</style>
</helmet>
<div style="min-height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F3F3; color: #1B1B1B; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; line-height: 1.35">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px 12px; background: #F3F3F3">
<strong style="font-size: 14px; padding-right: 12px">EasiSlides</strong>
<sc-for list="{{menus}}" as="m" hint-placeholder-count="6">
<button style="height: 32px; padding: 0 10px; background: transparent; border: 0; border-radius: 4px; color: #1B1B1B; font-size: 13px">{{m.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 0 8px; padding: 6px 8px; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="9">
<button style="height: 36px; margin-left: {{t.gap}}; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: transparent; border: 1px solid transparent; border-radius: 4px; color: #1B1B1B; font-size: 13px"><svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.d}}"></path></svg><span>{{t.label}}</span></button>
</sc-for>
<label style="flex: 1 1 260px; display: flex; align-items: center; gap: 8px; height: 36px; margin-left: 8px; padding: 0 10px; box-sizing: border-box; background: #FBFBFB; border: 1px solid #D1D1D1; border-bottom: 2px solid #8A8A8A; border-radius: 4px; color: #5C5C5C"><svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round"><path d="M7 2a5 5 0 1 0 0 10a5 5 0 0 0 0-10z M11 11l3 3"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">찾기</span><input type="search" placeholder="제목, 가사, 성경 구절 찾기" style="flex: 1; min-width: 0; height: 30px; background: transparent; border: 0; color: #1B1B1B; font-size: 13px"><span style="font-size: 11px; color: #5C5C5C; border: 1px solid #D1D1D1; border-radius: 4px; padding: 1px 5px">Ctrl+F</span></label>
<sc-for list="{{jumps}}" as="j" hint-placeholder-count="3">
<button style="height: 30px; padding: 0 10px; background: #F3F3F3; border: 1px solid #E0E0E0; border-radius: 15px; color: #1B1B1B; font-size: 12px">{{j.label}}</button>
</sc-for>
</div>

<div style="flex: 1; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px">

<aside style="flex: 22 1 290px; min-width: 0; display: flex; flex-direction: column; gap: 8px">

<section style="flex: 46 1 0; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px">
<div style="display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid #E0E0E0">
<sc-for list="{{sourceTabs}}" as="t" hint-placeholder-count="5">
<button style="height: 32px; padding: 0 8px; background: transparent; border: 0; border-bottom: 2px solid {{t.edge}}; color: {{t.ink}}; font-size: 13px; font-weight: {{t.weight}}">{{t.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<select aria-label="찬양 폴더" style="flex: 1; min-width: 0; height: 32px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 13px"><option>새찬송가</option></select>
<button style="height: 32px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 12px">글자 수순</button>
</div>
<input type="search" aria-label="이 폴더에서 찾기" placeholder="이 폴더에서 바로 찾기" style="height: 30px; box-sizing: border-box; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 12px">
<ul style="flex: 1 1 0; min-height: 0; list-style: none; margin: 0; padding: 0; overflow: hidden">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="11">
<li><button style="width: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: transparent; border: 0; border-radius: 4px; color: #1B1B1B; text-align: left; font-size: 13px"><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span><span style="font-size: 11px; color: #5C5C5C; background: #F3F3F3; border-radius: 4px; padding: 1px 6px">{{s.no}}</span></button></li>
</sc-for>
</ul>
</section>

<section style="flex: 54 1 0; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px">
<div style="display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #E0E0E0">
<button style="height: 32px; padding: 0 8px; background: transparent; border: 0; border-bottom: 2px solid #005FB8; color: #1B1B1B; font-size: 13px; font-weight: 700">예배 순서</button>
<button style="height: 32px; padding: 0 8px; background: transparent; border: 0; border-bottom: 2px solid transparent; color: #5C5C5C; font-size: 13px">찬양집</button>
<span style="flex: 1"></span>
<span style="color: #5C5C5C; font-size: 12px">4 / 24</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<select aria-label="예배 목록" style="flex: 1; min-width: 0; height: 32px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 13px"><option>01.주일예배</option></select>
<button style="height: 32px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 12px">관리</button>
<button style="height: 32px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 12px">파일 추가</button>
</div>
<ol style="flex: 1 1 0; min-height: 0; list-style: none; margin: 0; padding: 0; overflow: hidden">
<sc-for list="{{orderRows}}" as="o" hint-placeholder-count="13">
<li style="margin-top: {{o.gap}}"><button style="width: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: {{o.fill}}; border: 1px solid {{o.bar}}; border-radius: 4px; color: #1B1B1B; text-align: left; font-size: 13px; font-weight: {{o.weight}}"><span style="flex: 0 0 34px; font-size: 11px; font-weight: 400; color: {{o.tagInk}}; background: {{o.tagFill}}; border-radius: 4px; text-align: center; padding: 1px 0">{{o.tag}}</span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.title}}</span><span style="font-size: 11px; font-weight: 700; color: {{o.badgeInk}}">{{o.badge}}</span></button></li>
</sc-for>
</ol>
<div style="display: flex; flex-wrap: wrap; gap: 4px; padding-top: 6px; border-top: 1px solid #E0E0E0">
<sc-for list="{{orderCmds}}" as="t" hint-placeholder-count="5">
<button style="height: 30px; padding: 0 8px; background: #FBFBFB; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B; font-size: 12px">{{t.label}}</button>
</sc-for>
</div>
</section>
</aside>

<section style="flex: 37 1 340px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: #E5F1FB; border-bottom: 1px solid #E0E0E0">
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: #005FB8; border-radius: 4px; padding: 2px 8px">미리보기</span>
<span style="font-size: 11px; color: #A03A12; background: #FFFFFF; border-radius: 4px; padding: 1px 6px">PPT</span>
<strong style="flex: 1 1 100px; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">m3109_예수사랑하심은</strong>
<sc-for list="{{previewHead}}" as="t" hint-placeholder-count="3">
<button aria-label="{{t.name}}" title="{{t.name}}" style="width: 38px; height: 34px; padding: 0; display: flex; align-items: center; justify-content: center; background: {{t.fill}}; border: 1px solid {{t.edge}}; border-radius: 4px; color: {{t.ink}}"><svg aria-hidden="true" viewBox="0 0 16 16" width="18" height="18" style="fill: {{t.svgFill}}; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.d}}"></path></svg></button>
</sc-for>
</div>
<div style="flex: 1 1 0; min-height: 300px; box-sizing: border-box; padding: 10px; background: #FAFAFA">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{previewSlides}}" as="s" hint-placeholder-count="8">
<button style="display: flex; flex-direction: column; gap: 3px; padding: 0; background: transparent; border: 0; color: #1B1B1B; text-align: left; font-size: 12px">
<span style="aspect-ratio: 4 / 3; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 3px solid {{s.ring}}; border-radius: 6px; overflow: hidden"><span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px"><span aria-hidden="true" style="width: 62%; height: 5px; border-radius: 2px; background: #3A3A3A"></span><span aria-hidden="true" style="width: 48%; height: 5px; border-radius: 2px; background: #3A3A3A"></span></span><span aria-hidden="true" style="height: 30%; background: #E6D3EA"></span></span>
<span style="display: flex; align-items: center; gap: 6px"><span style="min-width: 18px; text-align: center; font-size: 11px; font-weight: 700; color: #1B1B1B; background: #FFE45C; border-radius: 3px; padding: 0 3px">{{s.n}}</span><span style="flex: 1; color: #5C5C5C">{{s.note}}</span><span style="font-size: 11px; font-weight: 700; color: {{s.ring}}">{{s.badge}}</span></span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid #E0E0E0; border-bottom: 1px solid #E0E0E0">
<button aria-pressed="true" style="height: 30px; padding: 0 10px; background: #E5F1FB; border: 1px solid #005FB8; border-radius: 4px 0 0 4px; color: #00437F; font-size: 12px; font-weight: 700">슬라이드</button>
<button style="height: 30px; padding: 0 10px; background: #FFFFFF; border: 1px solid #D1D1D1; border-left: 0; color: #1B1B1B; font-size: 12px">서식</button>
<button style="height: 30px; padding: 0 10px; background: #FFFFFF; border: 1px solid #D1D1D1; border-left: 0; border-radius: 0 4px 4px 0; color: #1B1B1B; font-size: 12px">정보</button>
<button aria-label="예배 메모 보기" title="예배 메모 보기" style="width: 34px; height: 30px; margin-left: 4px; padding: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B"><svg aria-hidden="true" viewBox="0 0 16 16" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"><path d="M3 3h9v10H3z M5 6h5 M5 8h5 M5 10h3"></path></svg></button>
<span style="flex: 1"></span>
<sc-for list="{{navs}}" as="n" hint-placeholder-count="4">
<button aria-label="{{n.name}}" title="{{n.name}}" style="width: 34px; height: 30px; margin-left: {{n.gap}}; padding: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B"><svg aria-hidden="true" viewBox="0 0 16 16" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"><path d="{{n.d}}"></path></svg></button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; background: #EDEDED">
<div style="flex: 0 1 330px; min-width: 200px; aspect-ratio: 4 / 3; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 4px; overflow: hidden">
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px"><span aria-hidden="true" style="width: 62%; height: 11px; border-radius: 3px; background: #3A3A3A"></span><span aria-hidden="true" style="width: 48%; height: 11px; border-radius: 3px; background: #3A3A3A"></span></span><span aria-hidden="true" style="height: 30%; background: #E6D3EA"></span>
</div>
<div style="flex: 1 1 130px; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px">
<strong style="font-size: 13px">슬라이드 1 / 8</strong>
<span style="color: #5C5C5C">파일</span>
<span>m3109_예수사랑하심은.pptx</span>
<details style="border-top: 1px solid #D6D6D6; border-bottom: 1px solid #D6D6D6; padding: 4px 0"><summary style="min-height: 26px; display: flex; align-items: center; gap: 6px; color: #1B1B1B; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 16 16" width="12" height="12" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 3l5 5-5 5"></path></svg><span>슬라이드 노트 보기</span></summary><span style="display: block; padding: 4px 0 2px 18px">[슬라이드 노트 내용]</span></details>
<span style="color: #5C5C5C">애니메이션, 동영상</span>
<span>[클릭 단계 수와 동영상 유무]</span>
</div>
</div>
</section>

<section style="flex: 41 1 340px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #E0E0E0; border-radius: 8px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 10px; background: #FDEDE3; border-bottom: 1px solid #E0E0E0">
<span style="font-size: 11px; font-weight: 700; color: #FFFFFF; background: {{live}}; border-radius: 4px; padding: 2px 8px">송출 중</span>
<span style="font-size: 11px; color: #A03A12; background: #FFFFFF; border-radius: 4px; padding: 1px 6px">PPT</span>
<strong style="flex: 1 1 100px; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">m3109_예수사랑하심은</strong>
<sc-for list="{{liveHead}}" as="t" hint-placeholder-count="3">
<button aria-label="{{t.name}}" title="{{t.name}}" aria-pressed="{{t.on}}" style="width: 38px; height: 34px; margin-left: {{t.gap}}; padding: 0; display: flex; align-items: center; justify-content: center; background: {{t.fill}}; border: 1px solid {{t.edge}}; border-radius: 4px; color: {{t.ink}}"><svg aria-hidden="true" viewBox="0 0 16 16" width="18" height="18" style="fill: {{t.svgFill}}; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"><path d="{{t.d}}"></path></svg></button>
</sc-for>
</div>
<div style="flex: 1 1 0; min-height: 300px; box-sizing: border-box; padding: 10px; background: #FAFAFA">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{liveSlides}}" as="s" hint-placeholder-count="8">
<button style="display: flex; flex-direction: column; gap: 3px; padding: 0; background: transparent; border: 0; color: #1B1B1B; text-align: left; font-size: 12px">
<span style="aspect-ratio: 4 / 3; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 3px {{s.style}} {{s.ring}}; border-radius: 6px; overflow: hidden"><span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px"><span aria-hidden="true" style="width: 62%; height: 5px; border-radius: 2px; background: #3A3A3A"></span><span aria-hidden="true" style="width: 48%; height: 5px; border-radius: 2px; background: #3A3A3A"></span></span><span aria-hidden="true" style="height: 30%; background: #E6D3EA"></span></span>
<span style="display: flex; align-items: center; gap: 6px"><span style="min-width: 18px; text-align: center; font-size: 11px; font-weight: 700; color: #1B1B1B; background: #FFE45C; border-radius: 3px; padding: 0 3px">{{s.n}}</span><span style="flex: 1; color: #5C5C5C">{{s.note}}</span><span style="font-size: 11px; font-weight: 700; color: {{s.badgeInk}}">{{s.badge}}</span></span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 10px; border-top: 1px solid #E0E0E0; border-bottom: 1px solid #E0E0E0">
<sc-for list="{{liveCmds}}" as="n" hint-placeholder-count="3">
<button aria-label="{{n.name}}" title="{{n.name}}" style="width: 34px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B"><svg aria-hidden="true" viewBox="0 0 16 16" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"><path d="{{n.d}}"></path></svg></button>
</sc-for>
<span style="flex: 1"></span>
<sc-for list="{{navs}}" as="n" hint-placeholder-count="4">
<button aria-label="{{n.name}}" title="{{n.name}}" style="width: 34px; height: 30px; margin-left: {{n.gap}}; padding: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 1px solid #D1D1D1; border-radius: 4px; color: #1B1B1B"><svg aria-hidden="true" viewBox="0 0 16 16" width="17" height="17" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round"><path d="{{n.d}}"></path></svg></button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding: 12px; background: #EDEDED">
<div style="flex: 0 1 330px; min-width: 200px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; color: {{liveText}}">지금 나가는 화면</span>
<div style="aspect-ratio: 4 / 3; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 2px solid {{live}}; border-radius: 4px; overflow: hidden">
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px"><span aria-hidden="true" style="width: 62%; height: 11px; border-radius: 3px; background: #3A3A3A"></span><span aria-hidden="true" style="width: 48%; height: 11px; border-radius: 3px; background: #3A3A3A"></span></span><span aria-hidden="true" style="height: 30%; background: #E6D3EA"></span>
</div>
</div>
<div style="flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px">
<span style="font-weight: 700; color: #5C5C5C">다음 슬라이드</span>
<div style="max-width: 190px; aspect-ratio: 4 / 3; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #C8C8C8; border-radius: 4px; overflow: hidden">
<span style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px"><span aria-hidden="true" style="width: 56%; height: 6px; border-radius: 2px; background: #3A3A3A"></span><span aria-hidden="true" style="width: 44%; height: 6px; border-radius: 2px; background: #3A3A3A"></span></span><span aria-hidden="true" style="height: 30%; background: #E6D3EA"></span>
</div>
<strong style="padding-top: 6px; font-size: 13px">슬라이드 1 / 8</strong>
<span style="color: #5C5C5C">다음 항목: 오라우리가여호와의</span>
<span style="margin-top: 4px; padding-top: 6px; border-top: 1px solid #D6D6D6">쇼 진행 중 · 글자 표시 중 · 검은 화면 꺼짐</span>
</div>
</div>
</section>

</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; min-height: 28px; box-sizing: border-box; padding: 4px 12px; background: #F3F3F3; border-top: 1px solid #E0E0E0; color: #5C5C5C; font-size: 12px">
<span>폴더 644곡 · 예배 순서 24개</span>
<span style="flex: 1">미리보기: 예배 순서 · m3109_예수사랑하심은</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #0F7B0F"></span>출력 모니터 연결됨</span>
<span>자동 넘김: 묶음 반복</span>
</div>
